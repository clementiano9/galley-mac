<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>tiny-viewer — "More files" treatments</title>
<link rel="stylesheet" href="tiny-viewer/tv-tokens.css">
<link rel="stylesheet" href="tiny-viewer/tv-app.css">
<style>
  html, body { margin: 0; background: #ece9e3 !important; color-scheme: light dark; }
  .page { max-width: 1180px; margin: 0 auto; padding: 40px 32px 100px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .page h1 { font-size: 25px; letter-spacing: -.4px; margin: 0 0 6px; color: #221f1a !important; }
  .page .sub { font-size: 14.5px; color: #756e63 !important; margin: 0 0 30px; max-width: 640px; text-wrap: pretty; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 26px; }
  @media (max-width: 920px){ .grid { grid-template-columns: 1fr; } }
  .opt { display: flex; flex-direction: column; gap: 12px; }
  .opt-head { display: flex; align-items: baseline; gap: 10px; }
  .opt-tag { font-size: 11px; font-weight: 700; letter-spacing: .4px; color: #fff !important; background: #b06a32 !important; border-radius: 6px; padding: 3px 8px; }
  .opt-name { font-size: 15px; font-weight: 650; color: #221f1a !important; }
  .opt-note { font-size: 13px; color: #756e63 !important; margin: 0; line-height: 1.5; text-wrap: pretty; }
  /* render each mini sidebar as a real chunk of the app */
  .mini {
    width: 248px; border: 1px solid rgba(0,0,0,.1); border-radius: 12px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 14px 34px rgba(0,0,0,.12);
  }
  .mini .tv-sidebar { width: 248px; height: auto; border-right: 0; }
  .mini .tv-side-scroll { overflow: visible; padding-bottom: 14px; }

  /* ════ shared deep-file primitives the treatments draw on ════ */
  /* T1 — breadcrumb prefix */
  .mf1-crumb { color: var(--tv-text-muted) !important; }
  .mf1-crumb .sep { margin: 0 3px; opacity: .7; }
  .mf1-name { color: var(--tv-text-secondary) !important; }
  .tv-tree-row.active .mf1-name, .tv-tree-row.active .mf1-crumb { color: var(--tv-accent-text) !important; }

  /* T2 — two-line stacked */
  .mf2-row { align-items: flex-start !important; }
  .mf2-stack { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .mf2-name { color: var(--tv-text-secondary) !important; line-height: 1.3; }
  .mf2-path { font-size: 11px; color: var(--tv-text-muted) !important; line-height: 1.2; font-family: var(--tv-font-mono); }

  /* T3 — collapsible synthetic bucket */
  .mf3-head { font-style: normal; }
  .mf3-head .ic-ell { color: var(--tv-text-muted); display: inline-flex; }
  .mf3-trail { margin-left: auto; font-size: 11px; color: var(--tv-text-muted) !important; font-family: var(--tv-font-mono); flex: 0 0 auto; padding-left: 8px; }
  .tv-tree-row.active .mf3-trail { color: var(--tv-accent-text) !important; opacity: .8; }

  /* T4 — grouped by directory, lightweight */
  .mf4-dir {
    display: flex; align-items: center; gap: 6px; padding: 5px 8px 2px 18px;
    font-size: 11px; font-weight: 600; letter-spacing: .2px; color: var(--tv-text-muted) !important;
    font-family: var(--tv-font-mono);
  }
  .mf4-dir .ic { opacity: .8; display: inline-flex; }
  .tv-tree-row.file.mf4-file { padding-left: 38px; }
</style>
</head>
<body>
<div class="page">
  <h1>“More files” — design treatments</h1>
  <p class="sub">Deep files (more than one level down) get flattened into a bucket under their folder. Four ways to show them, each in real sidebar context. The current build uses a weak version of #1.</p>
  <div class="grid" id="grid"></div>
</div>

<script src="tiny-viewer/tv-markdown.js"></script>
<script>
const ICON = {
  folder: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.8 4.2c0-.6.4-1 1-1h3l1.4 1.4h6c.6 0 1 .4 1 1v6c0 .6-.4 1-1 1H2.8c-.6 0-1-.4-1-1V4.2Z"/></svg>',
  doc: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 1.8h5l3 3v9.4c0 .3-.2.5-.5.5H4c-.3 0-.5-.2-.5-.5V2.3c0-.3.2-.5.5-.5Z"/><path d="M9 1.8v3.2h3"/></svg>',
  chev: '<svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><path d="M3.4 2 6.6 5 3.4 8z"/></svg>',
  ellipsis: '<svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><circle cx="4" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12" cy="8" r="1.3"/></svg>',
  layers: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M8 2 2 5l6 3 6-3-6-3Z"/><path d="m2 8 6 3 6-3M2 11l6 3 6-3"/></svg>',
};

// the shared top of every mini sidebar (folder head + a couple files + a real subfolder)
function commonTop() {
  return (
    '<div class="tv-folder-head"><span class="tv-chev open">' + ICON.chev + '</span>' + ic(ICON.folder) + '<span class="fname">/ai-projects</span></div>' +
    '<div class="tv-folder-body">' +
      row('schema.md', { active: true }) +
      row('flow.md') +
      '<div class="tv-tree-row subfolder"><span class="tv-chev open">' + ICON.chev + '</span>' + ic(ICON.folder) + '<span>drafts</span></div>' +
      row('schema-v2.md', { nested: true })
  );
}
function ic(d, cls) { return '<span class="ic ' + (cls || '') + '">' + d + '</span>'; }
function row(name, o) {
  o = o || {};
  return '<div class="tv-tree-row file' + (o.active ? ' active' : '') + (o.nested ? ' nested' : '') + '">' +
    ic(ICON.doc) + '<span class="tname">' + name + '</span></div>';
}
function shell(inner) {
  return '<div class="mini"><aside class="tv tv--light tv--accent-warm tv-sidebar"><div class="tv-side-scroll">' +
    commonTop() + inner + '</div></aside></div>';
}

const DEEP = [
  { name: 'old-spec.md', dir: 'legacy', crumb: 'legacy' },
  { name: 'rfc-019.md', dir: 'archive/rfcs', crumb: 'archive › rfcs' },
];

// ── Treatment 1: breadcrumb prefix (location leads, then file) ──
function t1() {
  let s = '<div class="tv-side-label more">More files</div>';
  DEEP.forEach(function (d) {
    s += '<div class="tv-tree-row file"><span class="ic">' + ICON.doc + '</span>' +
      '<span class="mf1-crumb">' + d.crumb.replace(/›/g, '<span class="sep">›</span>') + '<span class="sep">›</span></span>' +
      '<span class="mf1-name">' + d.name + '</span></div>';
  });
  return s + '</div>';
}

// ── Treatment 2: two-line stacked (file primary, path beneath) ──
function t2() {
  let s = '<div class="tv-side-label more">More files</div>';
  DEEP.forEach(function (d) {
    s += '<div class="tv-tree-row file mf2-row"><span class="ic">' + ICON.doc + '</span>' +
      '<span class="mf2-stack"><span class="mf2-name">' + d.name + '</span>' +
      '<span class="mf2-path">' + d.dir + '/</span></span></div>';
  });
  return s + '</div>';
}

// ── Treatment 3: collapsible synthetic bucket, trailing path ──
function t3() {
  let s = '<div class="tv-tree-row subfolder mf3-head"><span class="tv-chev open">' + ICON.chev + '</span>' +
    '<span class="ic-ell">' + ICON.ellipsis + '</span><span>' + DEEP.length + ' deeper files</span></div>';
  DEEP.forEach(function (d) {
    s += '<div class="tv-tree-row file nested"><span class="ic">' + ICON.doc + '</span>' +
      '<span class="tname">' + d.name + '</span><span class="mf3-trail">' + d.dir + '/</span></div>';
  });
  return s + '</div>';
}

// ── Treatment 4: grouped under lightweight dir headers ──
function t4() {
  let s = '<div class="tv-side-label more">More files</div>';
  DEEP.forEach(function (d) {
    s += '<div class="mf4-dir">' + ICON.layers + d.dir + '/</div>' +
      '<div class="tv-tree-row file mf4-file"><span class="ic">' + ICON.doc + '</span><span class="tname">' + d.name + '</span></div>';
  });
  return s + '</div>';
}

const OPTS = [
  { tag: '1', name: 'Breadcrumb prefix', note: 'Location leads, filename follows — reads “in legacy, old-spec.md”. Compact, one line. A polished version of today’s build.', build: t1 },
  { tag: '2', name: 'Two-line stacked', note: 'Filename primary, path muted on a second line in mono. Clearest origin, but each row is taller.', build: t2 },
  { tag: '3', name: 'Collapsible bucket', note: 'A synthetic “··· N deeper files” group you can fold, with the path trailing right. Most native to the tree metaphor — signals these are bucketed, not a real folder.', build: t3 },
  { tag: '4', name: 'Grouped by directory', note: 'Tiny dir headers regroup the flat list by location. Closest to real nesting without the depth — but reintroduces some of the hierarchy we flattened.', build: t4 },
];

const grid = document.getElementById('grid');
OPTS.forEach(function (o) {
  const el = document.createElement('div');
  el.className = 'opt';
  el.innerHTML =
    '<div class="opt-head"><span class="opt-tag">' + o.tag + '</span><span class="opt-name">' + o.name + '</span></div>' +
    '<p class="opt-note">' + o.note + '</p>' +
    shell(o.build());
  grid.appendChild(el);
});
</script>
</body>
</html>
