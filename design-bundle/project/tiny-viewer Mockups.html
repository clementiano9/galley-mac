<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>tiny-viewer — Visual Design</title>
<link rel="stylesheet" href="tiny-viewer/tv-tokens.css">
<link rel="stylesheet" href="tiny-viewer/tv-app.css">
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: #f0eee9 !important; }
  #root { background: #f0eee9 !important; }
  .design-canvas { background: #f0eee9 !important; }
  /* host dark-emulation darkens un-backgrounded starter wrappers — keep them transparent */
  .design-canvas > div,
  .design-canvas [data-dc-section],
  .design-canvas [data-dc-slot],
  .design-canvas .dc-labelrow,
  .design-canvas .dc-sectionhead { background-color: transparent !important; }
  /* global toolbar (floats above the canvas) */
  #tv-toolbar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 1000; display: flex; align-items: center; gap: 14px;
    padding: 8px 10px 8px 16px; border-radius: 14px;
    background: rgba(255,255,255,.82) !important; backdrop-filter: blur(18px) saturate(1.4);
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 10px 34px rgba(0,0,0,.16), 0 0 0 1px rgba(0,0,0,.05);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #tv-toolbar .brand { font-size: 13.5px; font-weight: 700; letter-spacing: -.2px; color: #2a251f; }
  #tv-toolbar .brand .dim { font-weight: 500; color: #9b948a; margin-left: 7px; }
  #tv-toolbar .tb-divider { width: 1px; height: 22px; background: rgba(0,0,0,.1) !important; }
  #tv-toolbar .tb-group { display: flex; align-items: center; gap: 7px; }
  #tv-toolbar .tb-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #a59d92; }
  .seg { display: flex; background: rgba(0,0,0,.05) !important; border-radius: 9px; padding: 2px; }
  .seg button {
    -webkit-appearance: none; appearance: none;
    border: 0; background: transparent; font: 500 12.5px inherit; color: #6b6358;
    padding: 5px 12px; border-radius: 7px; cursor: pointer; transition: all .14s;
  }
  .seg button.on { background: #fff !important; color: #2a251f; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .swatches { display: flex; gap: 6px; }
  .swatch {
    -webkit-appearance: none; appearance: none;
    width: 24px; height: 24px; border-radius: 7px; cursor: pointer; padding: 0;
    border: 2px solid transparent; transition: transform .12s, border-color .12s;
    position: relative;
  }
  .swatch:hover { transform: translateY(-1px); }
  .swatch.on { border-color: rgba(0,0,0,.85); }
  .swatch.blue { background: #2d68d8 !important; }
  .swatch.graphite { background: #586071 !important; }
  .swatch.warm { background: #c26a3a !important; }
  #tv-toolbar a.spec-link {
    display: inline-flex; align-items: center; gap: 7px;
    text-decoration: none; font-size: 12.5px; font-weight: 600; color: #2a251f;
    padding: 7px 13px; border-radius: 9px; background: rgba(0,0,0,.05) !important; transition: background .14s;
  }
  #tv-toolbar a.spec-link:hover { background: rgba(0,0,0,.1) !important; }
  #tv-hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 1000; font: 500 12px -apple-system, system-ui, sans-serif; color: #8a8276;
    background: rgba(255,255,255,.8) !important; backdrop-filter: blur(12px);
    padding: 7px 14px; border-radius: 20px; box-shadow: 0 4px 16px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04);
  }
  #tv-hint b { color: #5a5249; font-weight: 650; }
  #tv-hint .kc { font-family: ui-monospace, monospace; background: rgba(0,0,0,.07) !important; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
  /* lock toolbar text against intermittent forced-dark inversion */
  #tv-toolbar .brand { color: #2a251f !important; }
  #tv-toolbar .brand .dim { color: #9b948a !important; }
  #tv-toolbar .tb-label { color: #a59d92 !important; }
  .seg button { color: #6b6358 !important; }
  .seg button.on { color: #2a251f !important; }
  #tv-toolbar a.spec-link { color: #2a251f !important; }
  #tv-hint { color: #8a8276 !important; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="tiny-viewer/tv-markdown.js"></script>
<script src="tiny-viewer/tv-docs.js"></script>
<script src="tiny-viewer/tv-viewer.js"></script>
<script type="text/babel" src="tiny-viewer/design-canvas.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// mounts a vanilla tiny-viewer window inside an artboard
function Viewer({ screen, interactive, theme, accent }) {
  const ref = useRef(null);
  useEffect(() => {
    const root = ref.current;
    let cleanup;
    if (interactive) {
      cleanup = window.tvWire(root, { screen });
    } else {
      root.innerHTML = window.tvBuildApp({ screen });
      if (screen === "live") cleanup = window.tvAnimateLive(root);
      else if (window.tvResolveDiagrams) window.tvResolveDiagrams(root, 1000);
    }
    return () => { if (cleanup) cleanup(); };
  }, [screen, interactive]);
  // theme/accent are NOT effect deps — class swap re-skins without rebuilding
  return <div ref={ref} className={"tv tv--" + theme + " tv--accent-" + accent}
              style={{ width: "100%", height: "100%" }} />;
}

function Toolbar({ theme, setTheme, accent, setAccent }) {
  const seg = (val, cur, set, label) => (
    <button className={cur === val ? "on" : ""} onClick={() => set(val)}>{label}</button>
  );
  return (
    <div id="tv-toolbar">
      <div className="brand">tiny&#8209;viewer<span className="dim">Step 7 · Visual Design</span></div>
      <div className="tb-divider"></div>
      <div className="tb-group">
        <span className="tb-label">Theme</span>
        <div className="seg">
          {seg("light", theme, setTheme, "Light")}
          {seg("dark", theme, setTheme, "Dark")}
        </div>
      </div>
      <div className="tb-group">
        <span className="tb-label">Accent</span>
        <div className="swatches">
          {["blue", "graphite", "warm"].map((a) => (
            <button key={a} className={"swatch " + a + (accent === a ? " on" : "")}
                    title={a} onClick={() => setAccent(a)}></button>
          ))}
        </div>
      </div>
      <div className="tb-divider"></div>
      <a className="spec-link" href="tiny-viewer Visual Spec.html">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4">
          <path d="M3 2.5h7l3 3v8H3z"/><path d="M5.5 7h5M5.5 9.5h5M5.5 12h3"/></svg>
        Design Spec
      </a>
    </div>
  );
}

function App() {
  const [theme, setTheme] = useState(() => localStorage.getItem("tv-theme") || "light");
  const [accent, setAccent] = useState(() => localStorage.getItem("tv-accent") || "blue");
  useEffect(() => { localStorage.setItem("tv-theme", theme); }, [theme]);
  useEffect(() => { localStorage.setItem("tv-accent", accent); }, [accent]);

  const W = 1180, H = 760;
  const board = (props) => (
    <DCArtboard {...props} width={W} height={H}
      style={{ borderRadius: 12, boxShadow: "0 1px 2px rgba(0,0,0,.12), 0 24px 60px rgba(0,0,0,.18)" }} />
  );

  return (
    <React.Fragment>
      <Toolbar theme={theme} setTheme={setTheme} accent={accent} setAccent={setAccent} />
      <div id="tv-hint">
        The <b>Reading</b> screen is live — try <span className="kc">⌘K</span> <span className="kc">⌘B</span>,
        click tabs, or <b>double&#8209;click</b> the document to edit
      </div>
      <DesignCanvas>
        <DCSection id="screens" title="tiny-viewer — Step 7 Visual Design"
          subtitle="Native macOS markdown viewer for AI power users · 5 hi-fi screens · toggle theme & accent above">
          <DCArtboard id="reading" label="1 · Reading — light, sidebar open  (interactive)"
            width={W} height={H}
            style={{ borderRadius: 12, boxShadow: "0 1px 2px rgba(0,0,0,.12), 0 24px 60px rgba(0,0,0,.18)" }}>
            <Viewer screen="reading" interactive theme={theme} accent={accent} />
          </DCArtboard>
          <DCArtboard id="live" label="2 · Live Watch — AI streaming"
            width={W} height={H}
            style={{ borderRadius: 12, boxShadow: "0 1px 2px rgba(0,0,0,.12), 0 24px 60px rgba(0,0,0,.18)" }}>
            <Viewer screen="live" theme={theme} accent={accent} />
          </DCArtboard>
          <DCArtboard id="palette" label="3 · Command Palette  (⌘K)"
            width={W} height={H}
            style={{ borderRadius: 12, boxShadow: "0 1px 2px rgba(0,0,0,.12), 0 24px 60px rgba(0,0,0,.18)" }}>
            <Viewer screen="palette" theme={theme} accent={accent} />
          </DCArtboard>
          <DCArtboard id="search" label="4 · Cross-tab Search  (⌘⇧F)"
            width={W} height={H}
            style={{ borderRadius: 12, boxShadow: "0 1px 2px rgba(0,0,0,.12), 0 24px 60px rgba(0,0,0,.18)" }}>
            <Viewer screen="search" theme={theme} accent={accent} />
          </DCArtboard>
          <DCArtboard id="empty" label="5 · Empty / First Launch"
            width={W} height={H}
            style={{ borderRadius: 12, boxShadow: "0 1px 2px rgba(0,0,0,.12), 0 24px 60px rgba(0,0,0,.18)" }}>
            <Viewer screen="empty" theme={theme} accent={accent} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
