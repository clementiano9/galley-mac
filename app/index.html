<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>tiny-viewer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232d68d8'/%3E%3Cpath d='M4.5 5h7M4.5 8h7M4.5 11h4.5' stroke='white' stroke-width='1.3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tv-tokens.css">
  <link rel="stylesheet" href="css/tv-app.css">
  <link rel="stylesheet" href="css/tv-tauri.css">
  <style>
    html, body, #tv-root {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #tv-root {
      width: 100%;
      position: relative;
    }
    /* ── Minimal fallback styles for new elements (dev-design owns full CSS) ── */

    /* U-02: Theme toggle button in titlebar */
    .tv-titlebtn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      color: inherit;
      opacity: 0.4;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .tv-titlebtn:hover { opacity: 0.9; }
    .tv-theme-toggle { line-height: 1; }

    /* F-07: Find bar */
    .tv-find {
      position: absolute;
      bottom: 12px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--tv-bg-chrome, #e9e9e6);
      border: 1px solid var(--tv-border, rgba(0,0,0,.1));
      border-radius: 8px;
      padding: 4px 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.12);
      z-index: 40;
      min-width: 260px;
    }
    .tv-find-input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 13px;
      color: inherit;
      min-width: 120px;
    }
    .tv-find-count {
      font-size: 11px;
      opacity: 0.6;
      white-space: nowrap;
      min-width: 40px;
      text-align: center;
    }
    .tv-find-nav {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 12px;
      color: inherit;
      opacity: 0.6;
    }
    .tv-find-nav:hover { opacity: 1; background: var(--tv-bg-hover, rgba(0,0,0,.06)); }
    .tv-find-close { margin-left: 2px; }

    /* Find marks */
    .md mark[data-find] {
      background: var(--tv-accent-weak, rgba(45,104,216,.15));
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }
    .md mark[data-find].current {
      background: var(--tv-accent, #2d68d8);
      color: #fff;
    }

    /* F-02: Recent sidebar section */
    .tv-side-recent { opacity: 0.75; }
    .tv-side-recent:hover { opacity: 1; }
    .tv-side-recent-label { font-size: 10px; opacity: 0.5; text-transform: uppercase; letter-spacing: .04em; }

    /* U-09: Empty state recent files */
    .tv-empty-recent {
      margin-top: 16px;
      width: 100%;
      max-width: 400px;
    }
    .tv-recent-row {
      display: flex;
      flex-direction: column;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      gap: 1px;
    }
    .tv-recent-row:hover { background: var(--tv-bg-hover, rgba(0,0,0,.05)); }
    .tv-recent-name { font-size: 13px; font-weight: 500; }
    .tv-recent-path { font-size: 10px; opacity: 0.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="tv-root"></div>

  <!-- D-02: #tv-controls persistent pill removed. Theme and accent switching
       is available via the command palette (⌘K → "Commands" group).
       dependency order: icons → docs → markdown → feature modules → app → native bridge -->
  <script src="js/tv-icons.js"></script>
  <script src="js/tv-docs.js"></script>
  <script src="js/tv-markdown.js"></script>
  <script src="js/tv-edit.js"></script>
  <script src="js/tv-palette.js"></script>
  <script src="js/tv-search.js"></script>
  <script src="js/tv-files.js"></script>
  <script src="js/tv-live.js"></script>
  <script src="js/tv-app.js"></script>
  <script src="js/tv-native.js"></script>
</body>
</html>
