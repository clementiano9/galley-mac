<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Galley</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232d68d8'/%3E%3Cpath d='M4.5 5h7M4.5 8h7M4.5 11h4.5' stroke='white' stroke-width='1.3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tv-tokens.css">
  <link rel="stylesheet" href="css/tv-app.css">
  <link rel="stylesheet" href="css/tv-tauri.css">
  <link rel="stylesheet" href="css/tv-print.css">
  <style>
    html, body, #tv-root {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #tv-root {
      width: 100%;
      position: relative;
    }
    /* ── Minimal fallback styles for new elements (dev-design owns full CSS) ── */

    /* C-37: .tv-titlebtn / .tv-theme-toggle removed from here — this inline
       block loads AFTER tv-app.css and silently won every tie (the ISS-002
       cascade gotcha, CLAUDE.md), so its opacity:0.4 was overriding
       tv-app.css's carefully-tuned opacity:.72 (UV-06, tuned to pass WCAG
       1.4.11 non-text contrast). tv-app.css now owns the component
       entirely, .tv-theme-toggle's line-height:1 included. */

    /* F-07: Find bar — full styling lives in tv-app.css (.tv-find et al.).
       ISS-002: the old inline fallback below set `bottom: 12px` and loaded
       AFTER tv-app.css, so it won the cascade and — combined with tv-app.css's
       `top` — stretched the bar to full viewport height. Removed so the
       canonical top-anchored, compact .tv-find in tv-app.css wins. */

    /* C-13: the duplicate find-mark rules that used to live here are gone —
       same ISS-002 cascade problem (this block loads after tv-app.css and
       wins ties), and they fought tv-app.css's `.md mark[data-find].current`
       rule instead of matching it. tv-app.css owns .md mark[data-find] now. */

    /* F-02: Recent sidebar section */
    .tv-side-recent { opacity: 0.75; }
    .tv-side-recent:hover { opacity: 1; }
    .tv-side-recent-label { font-size: 10px; opacity: 0.5; text-transform: uppercase; letter-spacing: .04em; }

    /* U-09: Empty state recent files */
    .tv-empty-recent {
      margin-top: 16px;
      width: 100%;
      max-width: 400px;
    }
    .tv-recent-row {
      display: flex;
      flex-direction: column;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      gap: 1px;
    }
    .tv-recent-row:hover { background: var(--tv-bg-hover, rgba(0,0,0,.05)); }
    .tv-recent-name { font-size: 13px; font-weight: 500; }
    .tv-recent-path { font-size: 10px; opacity: 0.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="tv-root"></div>

  <!-- D-02: #tv-controls persistent pill removed. Theme and accent switching
       is available via the command palette (⌘K → "Commands" group).
       dependency order: icons → docs → markdown → feature modules → app → native bridge -->
  <script src="js/tv-icons.js"></script>
  <script src="js/tv-docs.js"></script>
  <script src="js/tv-markdown.js"></script>
  <script src="js/tv-imgfix.js"></script>
  <script src="js/tv-edit.js"></script>
  <script src="js/tv-palette.js"></script>
  <script src="js/tv-search.js"></script>
  <script src="js/tv-files.js"></script>
  <script src="js/tv-live.js"></script>
  <script src="js/tv-tree.js"></script>
  <script src="js/tv-app.js"></script>
  <script src="js/tv-native.js"></script>
</body>
</html>
